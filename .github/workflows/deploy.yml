name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main # Скрипт будет запускаться при пуше в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем актуальный код из вашего репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Загружаем папку build в Yandex Object Storage
      - name: Deploy to Yandex S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws s3 sync ./build/ s3://${{ secrets.YANDEX_BUCKET_NAME }} \
            --endpoint-url=https://storage.yandexcloud.net \
            --delete
